[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
ContextTitle=Abrir panel web
ContextAction=["#DashboardUrl#"]
ContextTitle2=Editar configuración
ContextAction2=["#@#Settings.inc"]
ContextTitle3=Modo compacto
ContextAction3=#ActionCompact#
ContextTitle4=Actualizar ahora
ContextAction4=[!CommandMeasure MeasureScript "ManualRefresh()"]

[Metadata]
Name=Presupuesto de Tiempo
Author=OpenAI para DerNait
Information=Panel de escritorio conectado a una API para visualizar actividad actual, cobertura de registro y presupuesto semanal de tiempo.
Version=1.0.1
License=MIT

@include=#@#Settings.inc

; ============================================================
; TEXTOS DE LA INTERFAZ
; Viven aquí y no en el .lua a propósito: Rainmeter interpreta las cadenas
; que devuelve Lua como ANSI, así que un acento escrito en TimeBudget.lua
; se dibujaba como "Sin conexiÃ³n". Este archivo es UTF-16 y sí los respeta.
; {n} y {t} son marcadores que el script sustituye.
; ============================================================
[Variables]
; Alternancia panel completo <-> barra compacta.
; !ZPos 2 = siempre encima; 0 = orden normal. Rainmeter guarda ese valor en su
; propio Rainmeter.ini, y Compact queda en Settings.inc, asi que el modo
; elegido sobrevive a un refresco y a reiniciar Rainmeter.
ActionCompact=[!SetVariable Compact 1][!WriteKeyValue Variables Compact 1 "#@#Settings.inc"][!HideMeterGroup Full][!ShowMeterGroup Compact][!ZPos 2][!Redraw]
ActionExpand=[!SetVariable Compact 0][!WriteKeyValue Variables Compact 0 "#@#Settings.inc"][!HideMeterGroup Compact][!ShowMeterGroup Full][!ZPos 0][!Redraw]
TextOnline=EN LÍNEA
TextNoActivity=SIN ACTIVIDAD ACTIVA
TextNoActivityShort=Sin actividad
TextUnnamedActivity=Actividad sin nombre
TextStartHint=Inicia una actividad desde el panel web
TextStartedAt=Inició a las {t}
TextRunning=Actividad en curso
TextNoLeakName=Sin límite configurado
TextNoLimit=Sin límite
TextOfLimit={n}% del límite
TextExceeded={n}% · EXCEDIDO
TextDemoFooter=Modo demo · cambia DemoMode=0 cuando la API esté lista
TextSyncedNow=Sincronizado ahora · actualización automática cada 15 min
TextSyncedAgo=Sincronizado hace {n} min · actualización automática cada 15 min
TextContractError=La API respondió, pero el formato no coincide con API_CONTRACT.md
TextOffline=Sin conexión · se conservan los últimos datos disponibles

; ============================================================
; LÓGICA
; ============================================================

[MeasureScript]
Measure=Script
ScriptFile=#@#Scripts\TimeBudget.lua
DynamicVariables=1

; El endpoint debe devolver texto plano en el orden exacto documentado
; en @Resources\API_CONTRACT.md. Se realiza UNA sola petición.
;
; NOTA SOBRE LOS PATRONES DE LAS MEDIDAS HIJAS
; En una medida hija (URL=[MeasureApi]) Rainmeter devuelve la COINCIDENCIA
; COMPLETA, no el grupo de captura: con RegExp=.*?ok=([01]) y StringIndex=1
; el valor resultante era "ok=1" en vez de "1", así que el número siempre
; valía 0 y la skin creía que no había red. Por eso cada campo usa un
; lookbehind anclado a inicio de línea: la coincidencia entera ya es el valor.
[MeasureApi]
Measure=WebParser
URL=#ApiUrl#
Header=Authorization: Bearer #ApiToken#
Header2=Accept: text/plain
; La medida principal descarga el cuerpo completo. Cada campo se analiza
; por separado para que valores vacíos no rompan todo el widget.
RegExp=(?si)(.*)
StringIndex=1
UpdateRate=#ApiUpdateRate#
DynamicVariables=1
Disabled=#DemoMode#
FinishAction=[!UpdateMeasureGroup ApiFields][!CommandMeasure MeasureScript "ApplyApi()"]
OnConnectErrorAction=[!CommandMeasure MeasureScript "SetConnectionError()"]
OnRegExpErrorAction=[!CommandMeasure MeasureScript "SetContractError()"]

[MeasureApiOk]
Measure=WebParser
Group=ApiFields
URL=[MeasureApi]
RegExp=(?sim)(?<=^ok=)[01]
StringIndex=1
DynamicVariables=1

[MeasureServerTime]
Measure=WebParser
Group=ApiFields
URL=[MeasureApi]
RegExp=(?sim)(?<=^server_time_unix=)[0-9]+
StringIndex=1
DynamicVariables=1

[MeasureCurrentActive]
Measure=WebParser
Group=ApiFields
URL=[MeasureApi]
RegExp=(?sim)(?<=^current_activity_active=)[01]
StringIndex=1
DynamicVariables=1

[MeasureCurrentName]
Measure=WebParser
Group=ApiFields
URL=[MeasureApi]
RegExp=(?sim)(?<=^current_activity_name=)[^\r\n]*
StringIndex=1
DynamicVariables=1

[MeasureCurrentStartedAt]
Measure=WebParser
Group=ApiFields
URL=[MeasureApi]
RegExp=(?sim)(?<=^current_activity_started_at=)[^\r\n]*
StringIndex=1
DynamicVariables=1

[MeasureCurrentElapsed]
Measure=WebParser
Group=ApiFields
URL=[MeasureApi]
RegExp=(?sim)(?<=^current_activity_elapsed_seconds=)[0-9]+
StringIndex=1
DynamicVariables=1

[MeasureTodayTracked]
Measure=WebParser
Group=ApiFields
URL=[MeasureApi]
RegExp=(?sim)(?<=^today_tracked_minutes=)[0-9]+
StringIndex=1
DynamicVariables=1

[MeasureTodayElapsed]
